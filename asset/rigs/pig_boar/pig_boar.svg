<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rig-proof parts of the Heo Rừng puppet (decision 050). One canvas, one group "part-NAME" per part; ground at y=470, centre x=256.
       Painted replacements keep the same canvas and layer names (art_inbox/rig_pig_boar.md). -->
  <defs>
    <radialGradient id="fur" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a8754f"/><stop offset="0.6" stop-color="#8a5a3a"/><stop offset="1" stop-color="#6e452c"/>
    </radialGradient>
    <radialGradient id="furFar" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#83573a"/><stop offset="1" stop-color="#5c3a25"/>
    </radialGradient>
    <radialGradient id="head" cx="0.42" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#b07c55"/><stop offset="0.65" stop-color="#90603e"/><stop offset="1" stop-color="#734a2f"/>
    </radialGradient>
    <radialGradient id="snout" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f7c4bb"/><stop offset="1" stop-color="#e39a90"/>
    </radialGradient>
    <linearGradient id="hoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3e271b"/></linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4129"/><stop offset="1" stop-color="#4a2c1b"/></linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#5a3726"/><stop offset="1" stop-color="#1e120c"/></radialGradient>
  </defs>
  <g stroke="#4a2b1b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <g id="part-leg_bl">
      <path d="M118 392 q-6 40 -2 70 q12 8 30 0 q4 -32 2 -70 z" fill="url(#furFar)"/>
      <path d="M115 452 q15 10 32 0 l0 12 q-16 8 -32 0 z" fill="url(#hoof)" stroke-width="4"/>
    </g>
    <g id="part-leg_fl">
      <path d="M300 392 q-4 40 0 70 q14 8 30 0 q4 -32 0 -70 z" fill="url(#furFar)"/>
      <path d="M299 452 q16 10 32 0 l0 12 q-16 8 -32 0 z" fill="url(#hoof)" stroke-width="4"/>
    </g>

    <g id="part-body">
      <path d="M118 360 C112 300 160 268 222 268 C292 266 330 300 330 352 C330 408 282 430 218 430 C156 430 122 410 118 360 Z" fill="url(#fur)"/>
      <path d="M150 400 C180 420 262 422 300 398 C290 418 250 428 218 428 C186 428 160 420 150 400 Z" fill="#c49870" stroke="none"/>
      <ellipse cx="170" cy="318" rx="13" ry="9" fill="#c9a07a" stroke="none" opacity="0.85"/>
      <ellipse cx="200" cy="300" rx="10" ry="7" fill="#c9a07a" stroke="none" opacity="0.85"/>
      <ellipse cx="150" cy="350" rx="9" ry="7" fill="#c9a07a" stroke="none" opacity="0.8"/>
      <ellipse cx="232" cy="296" rx="8" ry="6" fill="#c9a07a" stroke="none" opacity="0.75"/>
      <path d="M150 290 q30 -16 70 -14" fill="none" stroke="#c08a62" stroke-width="5" opacity="0.6"/>
    </g>

    <g id="part-leg_br">
      <path d="M140 396 q-6 42 -2 68 q14 9 34 0 q4 -32 0 -68 z" fill="url(#fur)"/>
      <path d="M137 454 q17 11 36 0 l0 12 q-18 8 -36 0 z" fill="url(#hoof)" stroke-width="4"/>
    </g>
    <g id="part-leg_fr">
      <path d="M268 396 q-4 42 0 68 q15 9 34 0 q4 -32 0 -68 z" fill="url(#fur)"/>
      <path d="M267 454 q17 11 36 0 l0 12 q-18 8 -36 0 z" fill="url(#hoof)" stroke-width="4"/>
    </g>

    <g id="part-ear_far">
      <path d="M262 228 C250 196 256 168 272 158 C290 170 298 196 292 224 Z" fill="url(#furFar)"/>
      <path d="M268 220 C262 200 266 184 273 176 C282 188 284 204 282 218 Z" fill="#c98a80" stroke="none"/>
    </g>

    <g id="part-mane">
      <path d="M214 300 L196 268 L222 276 L208 236 L238 252 L232 210 L260 232 L264 194 L284 222 L298 190 L304 226 L322 212 L312 250 L270 262 L232 300 Z" fill="url(#mane)"/>
    </g>

    <g id="part-head">
      <path d="M238 284 C232 222 276 190 330 190 C392 190 430 228 428 282 C426 336 388 366 332 366 C276 366 242 338 238 284 Z" fill="url(#head)"/>
      <path d="M258 250 q20 -40 70 -46" fill="none" stroke="#c08a62" stroke-width="6" opacity="0.5"/>
      <ellipse cx="340" cy="314" rx="17" ry="10" fill="#f08f86" stroke="none" opacity="0.55"/>
      <ellipse cx="268" cy="306" rx="11" ry="8" fill="#f08f86" stroke="none" opacity="0.4"/>
    </g>

    <g id="part-ear_near">
      <path d="M338 214 C330 176 344 148 366 140 C384 156 386 190 372 218 Z" fill="url(#head)"/>
      <path d="M346 206 C342 182 350 166 362 158 C372 172 372 192 364 206 Z" fill="#e0a196" stroke="none"/>
    </g>

    <g id="part-snout">
      <path d="M392 318 C396 334 410 342 420 336 C412 336 404 328 402 318 Z" fill="#f4ead2" stroke-width="3.5"/>
      <ellipse cx="408" cy="296" rx="34" ry="27" fill="url(#snout)"/>
      <ellipse cx="400" cy="294" rx="6" ry="9" fill="#8a3f37" stroke="none"/>
      <ellipse cx="420" cy="294" rx="5.5" ry="8.5" fill="#8a3f37" stroke="none"/>
      <ellipse cx="404" cy="282" rx="10" ry="4" fill="#ffffff" stroke="none" opacity="0.45"/>
      <path d="M372 318 C368 338 378 352 394 352 C384 346 380 334 384 320 Z" fill="#f4ead2" stroke-width="3.5"/>
    </g>

    <!-- face slot: eyes (two eyes, three-quarter view) -->
    <g id="part-eyes_open">
      <ellipse cx="358" cy="262" rx="15" ry="18" fill="url(#eye)"/>
      <circle cx="353" cy="255" r="5.5" fill="#fff" stroke="none"/><circle cx="363" cy="268" r="2.5" fill="#fff" stroke="none"/>
      <ellipse cx="300" cy="260" rx="12" ry="15" fill="url(#eye)"/>
      <circle cx="296" cy="254" r="4.5" fill="#fff" stroke="none"/>
      <path d="M340 236 q16 -8 32 0" fill="none" stroke-width="4"/>
    </g>
    <g id="part-eyes_half">
      <path d="M343 262 q15 -6 30 0 q-2 16 -15 17 q-13 -1 -15 -17 z" fill="url(#eye)"/>
      <path d="M288 260 q12 -5 24 0 q-1 13 -12 14 q-11 -1 -12 -14 z" fill="url(#eye)"/>
      <path d="M340 240 q16 -6 32 0" fill="none" stroke-width="4"/>
    </g>
    <g id="part-eyes_closed">
      <path d="M343 266 q15 8 30 0" fill="none" stroke-width="5"/>
      <path d="M288 264 q12 7 24 0" fill="none" stroke-width="5"/>
    </g>
    <g id="part-eyes_angry">
      <ellipse cx="358" cy="266" rx="14" ry="14" fill="url(#eye)"/>
      <circle cx="354" cy="261" r="4.5" fill="#fff" stroke="none"/>
      <ellipse cx="300" cy="264" rx="11" ry="12" fill="url(#eye)"/>
      <path d="M336 240 L376 254" fill="none" stroke-width="6"/>
      <path d="M286 246 L314 252" fill="none" stroke-width="5.5"/>
    </g>
    <g id="part-eyes_hurt">
      <path d="M344 252 L370 264 L344 276" fill="none" stroke-width="5.5"/>
      <path d="M288 252 L310 262 L288 272" fill="none" stroke-width="5"/>
      <path d="M372 280 q4 10 0 16 q-6 -4 0 -16 z" fill="#8fd3ff" stroke="#4a8fc0" stroke-width="2"/>
    </g>
    <g id="part-eyes_dizzy">
      <path d="M358 262 m-12 0 a12 12 0 1 1 12 12 a8 8 0 1 1 -8 -8 a4 4 0 1 1 4 4" fill="none" stroke-width="3.5"/>
      <path d="M300 260 m-10 0 a10 10 0 1 1 10 10 a6 6 0 1 1 -6 -6" fill="none" stroke-width="3.5"/>
    </g>
    <g id="part-eyes_happy">
      <path d="M343 268 q15 -18 30 0" fill="none" stroke-width="5.5"/>
      <path d="M288 266 q12 -15 24 0" fill="none" stroke-width="5"/>
    </g>

    <!-- face slot: mouth -->
    <g id="part-mouth_neutral"><path d="M368 336 q10 6 20 0" fill="none" stroke-width="4"/></g>
    <g id="part-mouth_open">
      <path d="M362 330 q14 -4 28 0 q-2 22 -14 24 q-12 -2 -14 -24 z" fill="#7a2f2a"/>
      <path d="M368 346 q8 -6 16 0 q-8 6 -16 0 z" fill="#e8877f" stroke="none"/>
    </g>
    <g id="part-mouth_grit">
      <path d="M362 332 h28 q0 12 -14 14 q-14 -2 -14 -14 z" fill="#fff8ec"/>
      <path d="M370 332 v12 M378 332 v13 M386 332 v11" stroke-width="2.5"/>
    </g>
    <g id="part-mouth_smile">
      <path d="M362 332 q14 18 28 0 z" fill="#7a2f2a"/>
      <path d="M368 338 q8 6 16 0" fill="#e8877f" stroke="none"/>
    </g>
    <g id="part-mouth_cry"><path d="M364 342 q4 -8 8 0 q4 8 8 0 q4 -8 8 0" fill="none" stroke-width="4"/></g>

    <!-- chain: tail, drawn along +x from its root -->
    <g id="part-tail">
      <path d="M20 40 C40 34 60 36 76 40 C60 44 40 46 20 40 Z" fill="url(#fur)" stroke-width="3.5"/>
      <path d="M70 40 C78 26 96 24 104 32 C96 34 100 46 104 48 C96 56 78 54 70 40 Z" fill="url(#mane)" stroke-width="3.5"/>
    </g>
  </g>
</svg>
